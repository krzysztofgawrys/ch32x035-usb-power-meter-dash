# Static hosting for the Serial Terminal.
#
# The app has no backend - nginx serves the Vite build output and nothing else.
# The browser opens the serial port itself via the Web Serial API.

# Vite emits content-hashed filenames under /assets, so those can be cached
# permanently: a rebuild produces new names rather than new contents at the
# same name. index.html is the one file whose name is stable, so it must always
# be revalidated - it is what points at the current hashes.
#
# Keeping this in a map rather than a location block matters: nginx does not
# inherit add_header into a location that declares its own, so splitting them
# would silently drop the security headers on whichever path got its own block.
map $uri $term_cache_control {
    default       "no-cache";
    ~^/assets/    "public, max-age=31536000, immutable";
}

server {
    listen      8080;
    listen      [::]:8080;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    charset       utf-8;
    charset_types text/html text/css text/plain application/javascript;

    add_header Cache-Control $term_cache_control always;

    # Web Serial is only exposed in a secure context, and the Permissions
    # Policy for "serial" defaults to the own origin. Set it explicitly so no
    # intermediate proxy silently narrows the policy.
    add_header Permissions-Policy     "serial=(self)" always;
    add_header X-Content-Type-Options "nosniff"       always;
    add_header Referrer-Policy        "no-referrer"   always;
    # No style-src exception needed: uPlot ships a stylesheet (bundled, so
    # same-origin) and otherwise only touches el.style.*, which is CSSOM and
    # outside CSP's reach. Verified against the uPlot source before tightening.
    add_header Content-Security-Policy
        "default-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'" always;

    gzip            on;
    gzip_min_length 512;
    gzip_types      text/css text/javascript application/javascript image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
